name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0

      - name: Verify tag and package version
        id: package
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          TAG_REF="refs/tags/$TAG"
          git show-ref --verify --quiet "$TAG_REF"
          test "$(git rev-parse "$TAG_REF^{commit}")" = "$(git rev-parse HEAD)"
          VERSION=$(node --print "require('./package.json').version")
          case "$VERSION" in
            *-*)
              echo "Prerelease versions are not published by this workflow: $VERSION"
              exit 1
              ;;
          esac
          test "$TAG" = "v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run validate

      - name: Publish package
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "jest-joi@$VERSION" version >/dev/null 2>&1; then
            echo "jest-joi@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
